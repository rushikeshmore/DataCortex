[package]
name = "datacortex-vector"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "DataCortex compression codec for Vector.dev log pipelines"
repository = "https://github.com/RushikeshMore/datacortex"
authors = ["Rushikesh More"]
rust-version = "1.85"
keywords = ["compression", "vector", "logging", "ndjson", "codec"]
categories = ["compression", "encoding"]

[dependencies]
datacortex-core = { path = "../crates/datacortex-core" }

[dev-dependencies]
zstd = "0.13"
flate2 = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compression"
harness = false

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Allow these in a small proof-of-concept crate
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
